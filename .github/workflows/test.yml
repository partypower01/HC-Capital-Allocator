name: Test

# CI minutes (owner B005, 2026-09-29): run on main and on PRs only, not on every branch push (the
# sessions run the full suite locally before each push), and cancel a superseded run on the same ref.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm test
      # Bun unit tests under tests/ (pure allocation logic, no services).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun test tests
